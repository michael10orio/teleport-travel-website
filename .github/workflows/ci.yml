name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npx nx build web --configuration=production

      - name: Restore and build API
        run: dotnet build apps/api/Teleport.Api.csproj --configuration Release

      - name: Generate an ephemeral database password
        run: printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build and start Docker Compose
        run: docker compose up --detach --build

      - name: Wait for API and web
        run: |
          docker compose ps
          docker compose port api 8080
          curl --fail --silent --show-error --output /dev/null \
            --write-out 'API health HTTP %{http_code}\n' \
            --connect-timeout 5 --max-time 10 --retry 30 --retry-all-errors \
            --retry-delay 2 --retry-max-time 90 \
            http://127.0.0.1:5079/api/health
          curl --fail --silent --show-error --output /dev/null \
            --write-out 'API destinations HTTP %{http_code}\n' \
            --connect-timeout 5 --max-time 10 --retry 30 --retry-all-errors \
            --retry-delay 2 --retry-max-time 90 \
            http://127.0.0.1:5079/api/destinations
          curl --fail --silent --show-error --output /dev/null \
            --write-out 'Web HTTP %{http_code}\n' \
            --connect-timeout 5 --max-time 10 --retry 30 --retry-all-errors \
            --retry-delay 2 --retry-max-time 90 \
            http://127.0.0.1:4200/

      - name: Run API and database smoke tests
        run: bash scripts/smoke-test-api.sh

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Compose and remove the ephemeral test volume
        if: always()
        run: docker compose down --volumes --remove-orphans